| 1.0.0 - 1.0.1          | 9.2.0                     |
| 0.9.26                 | 9.1.1                     |
| 0.9.24 - 0.9.25        | 9.1.0                     |
| 0.9.22 - 0.9.23        | 9.0.4                     |
| 0.9.20 - 0.9.21        | 9.0.3                     |
| 0.9.17 to 0.9.19       | 9.0.2                     |
| 0.9.15 - 0.9.16        | 9.0.1                     |
| 0.9.9 to 0.9.14        | 9.0.0                     |
| 0.9.8                  | 8.3.4                     |
| 0.9.5 to 0.9.7         | 8.3.3                     |
